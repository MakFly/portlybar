name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the app bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Build ad-hoc signed bundle
        run: ./build.sh

      - name: Check the tag matches the source version
        run: |
          source_version="$(sed -n 's/public let portlyBarVersion = "\([^"]*\)"/\1/p' Sources/PortlyBarCore/Version.swift)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$source_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match portlyBarVersion $source_version" >&2
            exit 1
          fi

      - name: Package the bundle
        run: ditto -c -k --keepParent dist/PortlyBar.app "PortlyBar-${GITHUB_REF_NAME}.zip"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "PortlyBar-${GITHUB_REF_NAME}.zip" --clobber
