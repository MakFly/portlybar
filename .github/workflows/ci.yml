name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

  bundle:
    name: Build app bundle
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Build ad-hoc signed bundle
        run: ./build.sh

      - name: Verify the bundled CLI runs
        run: dist/PortlyBar.app/Contents/Resources/bin/portlybar --help

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: PortlyBar-app
          path: dist/PortlyBar.app
          if-no-files-found: error
